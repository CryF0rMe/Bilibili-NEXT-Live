name: Build iOS Live unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Apps/iOS/**'
      - 'Scripts/**'
      - 'Tests/**'
      - '.github/workflows/ios-live-unsigned.yml'
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select available Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | head -1)
          if [ -z "$XCODE" ]; then echo 'Xcode 26 is required but unavailable'; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Import upstream iOS source
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/wzk112/Bilibili-NEXT.git
          git -C upstream fetch --depth 1 origin 67bcc018d408e91b8427f2a7e667ddbd0f2ab011
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream log -1 --format='Upstream revision: %H %s'
          mkdir -p "$RUNNER_TEMP/live-source"
          cp Apps/iOS/Sources/MobileLive*.swift "$RUNNER_TEMP/live-source/"
          cp -R upstream/Apps .
          cp -R upstream/Sources .
          cp -R upstream/Vendor .
          cp -R upstream/Assets .
          cp upstream/CHANGELOG.md .
          cp -R upstream/Package.swift .
          cp "$RUNNER_TEMP/live-source/"*.swift Apps/iOS/Sources/
          python3 Scripts/apply-live-patch.py
          test -f Apps/iOS/BilibiliNEXT.xcodeproj/project.pbxproj
      - name: Validate live discovery and pagination
        timeout-minutes: 3
        run: |
          swiftc -swift-version 6 -parse-as-library \
            Apps/iOS/Sources/MobileLiveAPI.swift \
            Apps/iOS/Sources/MobileLiveModel.swift \
            Tests/LiveContractTests.swift \
            -o "$RUNNER_TEMP/live-contract-tests"
          "$RUNNER_TEMP/live-contract-tests" "$GITHUB_WORKSPACE/Tests/Fixtures"
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild -project Apps/iOS/BilibiliNEXT.xcodeproj \
            -scheme BilibiliNEXT -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Package unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$GITHUB_WORKSPACE/Bilibili-NEXT-Live-unsigned.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-NEXT-Live-unsigned-ipa
          path: Bilibili-NEXT-Live-unsigned.ipa
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
